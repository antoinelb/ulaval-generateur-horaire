[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/scraper",
    "crates/ui",
    "crates/wasm",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Antoine Lefebvre-Brossard <antoinelb@proton.me>"]

[workspace.dependencies]
ulaval-scheduler-core = { path = "crates/core" }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# declaration-only Tsify derives: the generated .d.ts mirrors the serde
# shapes (ADR `2026-08-types-typescript-tsify-declaratif`)
tsify = { version = "0.5", default-features = false, features = ["js"] }
# 0.2.100 introduced unchecked_param_type / unchecked_return_type
wasm-bindgen = "0.2.100"
# the whole-organigramme share link: state → postcard → deflate → base64url
# (ADR `2026-08-partage-de-lorganigramme-complet-en-fragment`)
postcard = { version = "1", default-features = false, features = ["alloc"] }
miniz_oxide = "0.8"
base64 = "0.22"

[workspace.lints.rust]
non_upper_case_globals = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[workspace.lints.clippy]
manual_range_contains = "allow"

[profile.dev.package.ulaval-scheduler-core]
opt-level = 2
