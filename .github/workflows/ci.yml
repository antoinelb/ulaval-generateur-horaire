name: CI

on:
  push:
    branches: [main]
  pull_request:
  # a data push made by scrape.yml with GITHUB_TOKEN never triggers `push`;
  # it redeploys through an explicit `gh workflow run ci.yml` instead
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - uses: Swatinem/rust-cache@v2
      # `make static` formats in place; CI only verifies
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy -p ulaval-scheduler-wasm --target wasm32-unknown-unknown -- -D warnings
      # deploy never runs on pull requests: a broken book must fail here
      - run: mdbook build docs/livre

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # same exclusions as `make test`, plus the blocking 100% threshold
      - run: cargo llvm-cov --ignore-filename-regex '(lib\.rs|/mod\.rs|/main\.rs)$' --fail-under-lines 100

  deploy:
    if: github.event_name != 'pull_request'
    needs: [static, test]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,mdbook
      - uses: Swatinem/rust-cache@v2
      - run: wasm-pack build crates/wasm --target web
      # the site serves the wasm package, the data snapshots and the book;
      # the real UI will take the root later (jalons 3-9)
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r crates/wasm/pkg _site/pkg
          cp data/*.json _site/data/
          cp -r data/programmes _site/data/programmes
          mdbook build docs/livre --dest-dir "$GITHUB_WORKSPACE/_site/docs"
      # Pages serves no directory listing; generate one at assembly time
      - name: Index the data directories
        run: |
          for d in _site/data _site/data/programmes; do
            ls -1 --color=never "$d" | grep -v '^index.html$' |
              sed 's|.*|<a href="&">&</a><br>|' > "$d/index.html"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
