name: CI

on:
  push:
    branches: [main]
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
  # a data push made by scrape.yml with GITHUB_TOKEN never triggers `push`;
  # it redeploys through an explicit `gh workflow run ci.yml` instead
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          # `make lint` builds the worker module through ui-calc
          tool: mdbook,wasm-pack
      - uses: Swatinem/rust-cache@v2
      # `make static` formats in place; CI only verifies, then runs the very
      # same lint set — the makefile is the single definition
      - run: cargo fmt --all --check
      - run: make lint
      # deploy never runs on pull requests: a broken book must fail here
      - run: make docs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,wasm-pack
      - uses: Swatinem/rust-cache@v2
      # exclusions and the blocking 100% threshold both live in the makefile
      - run: make test

  deploy:
    # the site only publishes tagged code: on a version tag push, or on the
    # data-refresh dispatch from scrape.yml (which redeploys the latest tag).
    # `on.push.tags` above already filters to bare version tags (`0.2.0`,
    # never `v`-prefixed — release.yml agrees), so being a tag at all is
    # the whole condition here
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    needs: [static, test]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          # the tag-picking step below needs every version tag and origin/main
          fetch-depth: 0
      # the published site is always: the latest version tag's code + main's
      # current data/ — a data refresh redeploys without retagging
      - name: Check out the tagged code with main's fresh data
        run: |
          tag="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          fi
          if [ -z "$tag" ]; then
            echo "No version tag exists yet; nothing to deploy" >&2
            exit 1
          fi
          git checkout "$tag"
          git checkout origin/main -- data/
          # the footer names both commits, and they differ here: the code
          # is the tag, the data is whatever main last wrote to data/.
          # Only this step knows the second one — ui-build's own fallback
          # would read the tag's history and name the wrong commit.
          {
            echo "DATA_HASH=$(git log -1 --format=%h origin/main -- data/)"
            echo "DEPLOYED_TAG=$tag"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          # the CLI is pinned to the version the UI is developed against: a
          # dx/dioxus mismatch is the classic Dioxus breakage
          tool: wasm-pack,mdbook,dioxus-cli@0.7.10
      - uses: Swatinem/rust-cache@v2
      - run: make wasm ui-build docs
      # the two commits the footer shows, findable from the run itself
      - name: Record what was deployed
        run: |
          {
            echo "### Déploiement"
            echo ""
            echo "| | commit |"
            echo "|---|---|"
            echo "| Code (tag \`$DEPLOYED_TAG\`) | \`$(git rev-parse --short HEAD)\` |"
            echo "| Données | \`$DATA_HASH\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      # the UI takes the root; pkg/ (the ES module), data/ (the snapshots)
      # and docs/ (the book) stay the documented public endpoints — the UI
      # reads its own hashed copies under /assets, never /data
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r _ui/public/. _site/
          cp -r crates/wasm/pkg _site/pkg
          cp data/*.json _site/data/
          cp -r data/programmes _site/data/programmes
          cp -r docs/livre/book _site/docs
      # Pages serves no directory listing; generate one at assembly time —
      # index.json (a flat array of file names) is the machine-readable one,
      # index.html the human-readable one
      - name: Index the data directories
        run: |
          ls -1 --color=never _site/data/programmes |
            jq -R . | jq -s . > _site/data/programmes/index.json
          for d in _site/data _site/data/programmes; do
            ls -1 --color=never "$d" | grep -v '^index.html$' |
              sed 's|.*|<a href="&">&</a><br>|' > "$d/index.html"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
