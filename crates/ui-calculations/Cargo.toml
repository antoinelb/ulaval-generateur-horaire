[package]
name = "ulaval-scheduler-ui-calculations"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
# rlib: the pure modules, consumed natively by `ui` and the tests;
# cdylib: the same crate compiled into the Web Worker's wasm module
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
ulaval-scheduler-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# the worker boundary exists only in the browser build
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
