[package]
name = "ulaval-scheduler-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
ulaval-scheduler-core = { workspace = true }
# the frontier crate's pure modules (credits, merge), called natively here —
# its worker module is the same artifact the JS interface downloads
ulaval-scheduler-wasm = { path = "../wasm", default-features = false }
dioxus = { version = "0.7.1", features = ["router"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
postcard = { workspace = true }
miniz_oxide = { workspace = true }
base64 = { workspace = true }

# browser glue only — the binary never runs natively
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = { workspace = true }
# awaiting a JS promise — the clipboard write reports its own refusal
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "CssStyleDeclaration",
    "Document",
    "DomTokenList",
    "Element",
    "History",
    "HtmlAnchorElement",
    "HtmlElement",
    "Location",
    "MessageEvent",
    "Navigator",
    "ServiceWorker",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
    "Storage",
    "Url",
    "Window",
    "Worker",
    "WorkerOptions",
    "WorkerType",
] }
web-time = "1"

[features]
default = ["web"]
web = ["dioxus/web"]

# The scenario tests (`docs/conception/adr/2026-08-tests-de-scenario-dans-ui.md`):
# one target, declared because the files live in a subdirectory rather than
# directly under `tests/`. They need no dev-dependency — an integration test
# links the crate's own `[dependencies]`.
[[test]]
name = "scenarios"
path = "tests/scenarios/main.rs"
