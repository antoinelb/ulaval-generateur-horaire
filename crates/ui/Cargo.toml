[package]
name = "ulaval-scheduler-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
ulaval-scheduler-core = { workspace = true }
# the frontier crate's pure modules (credits, merge), called natively here —
# its worker module is the same artifact the JS interface downloads
ulaval-scheduler-wasm = { path = "../wasm", default-features = false }
dioxus = { version = "0.7.1", features = ["router"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
postcard = { workspace = true }
miniz_oxide = { workspace = true }
base64 = { workspace = true }

# browser glue only — the binary never runs natively
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = { workspace = true }
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "Clipboard",
    "Document",
    "DomTokenList",
    "Element",
    "History",
    "HtmlElement",
    "Location",
    "MessageEvent",
    "Navigator",
    "ServiceWorker",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
    "Storage",
    "Window",
    "Worker",
    "WorkerOptions",
    "WorkerType",
] }
web-time = "1"

[features]
default = ["web"]
web = ["dioxus/web"]
