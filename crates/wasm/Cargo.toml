[package]
name = "ulaval-scheduler-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
# cdylib for the browser (the published package and the Dioxus app's worker
# module are the same artifact), rlib so the native tests and the `ui` crate
# link the pure modules
crate-type = ["cdylib", "rlib"]

[features]
default = ["boundary"]
# The browser surfaces and their glue. On by default so a forgotten flag can
# never publish a package with no exports; `ui` links the same crate with
# `default-features = false` for its pure modules alone, since carrying the
# glue it never calls costs ~800 Ko of its own wasm (ADR
# `2026-08-fusion-des-crates-wasm-et-ui-calculations`).
boundary = [
    "dep:wasm-bindgen",
    "dep:serde-wasm-bindgen",
    "dep:tsify",
    "ulaval-scheduler-core/tsify",
]

[dependencies]
# path, not `workspace = true`: the workspace declaration has no
# default-features of its own, so `workspace = true` plus
# `default-features = false` here is silently ignored by cargo (warns
# "could become a hard error") instead of disabling `parser`
ulaval-scheduler-core = { path = "../core", default-features = false }
serde = { workspace = true }
# the worker protocol speaks JSON strings both ways
serde_json = { workspace = true }

# the browser boundary exists only in the browser build: a native `cargo test`
# compiles neither the glue nor its dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
tsify = { workspace = true, optional = true }
