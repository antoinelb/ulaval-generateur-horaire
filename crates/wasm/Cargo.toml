[package]
name = "ulaval-scheduler-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
# cdylib for the browser, rlib so the native test binary links the crate
crate-type = ["cdylib", "rlib"]

[dependencies]
ulaval-scheduler-core = { workspace = true }
serde = { workspace = true }

# the JS boundary exists only in the browser build: a native `cargo test`
# compiles neither the glue nor its dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
serde_json = { workspace = true }
